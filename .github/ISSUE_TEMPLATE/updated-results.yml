name: Request updated results
description: Ask for a provider or model to be benchmarked again
title: "Updated results: "
body:
  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: As shown in the charts, e.g. "Baseten · fast, GLM-5.3", or "all models on Wafer".
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
      description: For example, a new deployment, a price change, or a fix for a problem in the last run.
    validations:
      required: true
